<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - SatYield</title>
    <link rel="stylesheet" href="universal-translate.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('farming-field-bg.jpg') center/cover no-repeat fixed;
            background-color: #2E4635;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 70, 53, 0.7);
            z-index: -1;
        }

        .auth-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            color: #2E4635;
            padding: 3rem;
            border-radius: 25px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 480px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .auth-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #4CAF50, #FBC02D, #f7931e);
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #FFD700, #FFA500, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 
                0 1px 0 #FFD700,
                0 2px 0 #FFA500,
                0 3px 0 #FF8C00,
                0 4px 8px rgba(255, 140, 0, 0.3);
            filter: drop-shadow(0 2px 4px rgba(255, 215, 0, 0.4));
            transform: translateY(-1px);
            font-weight: bold;
        }

        .logo p {
            color: #666;
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #2E4635;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 1rem;
            border: 2px solid rgba(46, 70, 53, 0.2);
            border-radius: 12px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #4CAF50;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.2);
            transform: translateY(-1px);
        }

        .signup-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(45deg, #4CAF50, #66BB6A);
            color: #FFFFFF;
            border: none;
            border-radius: 15px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(76, 175, 80, 0.3);
            position: relative;
            overflow: hidden;
        }
        
        .signup-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }
        
        .signup-btn:hover::before {
            left: 100%;
        }

        .signup-btn:hover {
            transform: translateY(-3px);
            background: linear-gradient(45deg, #FBC02D, #f7931e);
            color: #1B3B2F;
            box-shadow: 0 10px 30px rgba(251, 192, 45, 0.4);
        }

        .login-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .login-link a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 600;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        .terms {
            font-size: 0.9rem;
            color: #666;
            text-align: center;
            margin-top: 1rem;
            line-height: 1.4;
        }

        .terms a {
            color: #4CAF50;
            text-decoration: none;
            font-weight: 500;
        }
        
        .terms a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="logo">
            <h1>Join the farming revolution! 🌱</h1>
            <p>Let's grow better crops together</p>
        </div>

        <form id="signupForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" name="firstName" placeholder="Your first name" required>
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" name="lastName" placeholder="Your last name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Your mobile number" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="your.email@example.com" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Choose a strong password" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Type it again to be sure" required>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <select id="location" name="location" required>
                    <option value="">Select your state</option>
                    <option value="maharashtra">Maharashtra</option>
                    <option value="karnataka">Karnataka</option>
                    <option value="tamil-nadu">Tamil Nadu</option>
                    <option value="gujarat">Gujarat</option>
                    <option value="rajasthan">Rajasthan</option>
                    <option value="punjab">Punjab</option>
                    <option value="haryana">Haryana</option>
                    <option value="uttar-pradesh">Uttar Pradesh</option>
                    <option value="bihar">Bihar</option>
                    <option value="west-bengal">West Bengal</option>
                    <option value="andhra-pradesh">Andhra Pradesh</option>
                    <option value="telangana">Telangana</option>
                    <option value="kerala">Kerala</option>
                    <option value="madhya-pradesh">Madhya Pradesh</option>
                    <option value="orissa">Orissa</option>
                    <option value="assam">Assam</option>
                    <option value="other">Other</option>
                </select>
            </div>

            <button type="submit" class="signup-btn">🚀 Start My Farming Journey!</button>

            <div class="terms">
                By joining us, you agree to our <a href="#">Terms</a> and <a href="#">Privacy Policy</a>. Don't worry, we won't spam you! 📧
            </div>
        </form>

        <div class="login-link">
            <p>Already farming with us? <a href="login.html">Welcome back! 👋</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            
            if (password !== confirmPassword) {
                alert('Oops! Your passwords don\'t match. Please check and try again!');
                return;
            }
            
            if (password.length < 6) {
                alert('Hey! Your password needs to be at least 6 characters long for security!');
                return;
            }
            
            const formData = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                phone: document.getElementById('phone').value,
                email: document.getElementById('email').value,
                location: document.getElementById('location').value
            };
            
            // Store user data in localStorage for demo purposes
            localStorage.setItem('userData', JSON.stringify(formData));
            
            alert('🎉 Welcome to the farming family! Your account is ready. Let\'s get started!');
            window.location.href = 'dashboard.html';
        });
    </script>
    <script src="enhanced-translate.js"></script>
</body>
</html>
