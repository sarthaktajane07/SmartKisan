<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Yield Prediction - SmartKisan</title>
    <script src="i18n.js"></script>
    <script src="services.js"></script>
    <script src="ai-engine.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('farming-field-bg.jpg') center/cover no-repeat fixed;
            background-color: #2E4635;
            color: #333333;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(46, 70, 53, 0.7);
            z-index: -1;
        }

        .header {
            background: rgba(27, 59, 47, 0.95);
            backdrop-filter: blur(10px);
            padding: 1rem 2rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo h1 {
            font-size: 1.8rem;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 
                0 1px 0 #FFA500,
                0 2px 0 #FF8C00,
                0 3px 5px rgba(0,0,0,0.3),
                0 0 10px rgba(255,215,0,0.5);
            background: linear-gradient(45deg, #FFD700, #FFA500, #FF8C00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }

        .back-btn {
            background: linear-gradient(45deg, #FBC02D, #f7931e);
            color: #1B3B2F;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(251, 192, 45, 0.3);
        }

        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(251, 192, 45, 0.4);
            background: linear-gradient(45deg, #f7931e, #FBC02D);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .page-title {
            text-align: center;
            margin-bottom: 3rem;
        }

        .page-title h1 {
            font-size: 3rem;
            background: linear-gradient(45deg, #1B5E20, #4CAF50);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            font-weight: bold;
        }

        .page-title p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 1.2rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 2rem;
        }

        .card {
            background: rgba(46, 70, 53, 0.95);
            backdrop-filter: blur(10px);
            color: #F5F5F5;
            border-radius: 20px;
            padding: 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #FBC02D, #f7931e, #4CAF50);
        }

        .card:hover {
            transform: translateY(-5px);
        }

        .card h3 {
            color: #F5F5F5;
            margin-bottom: 1.5rem;
            font-size: 1.4rem;
            font-weight: bold;
        }

        label {
            display: block;
            margin: 1rem 0 0.5rem;
            color: #F5F5F5;
            font-weight: 500;
            font-size: 0.95rem;
        }

        select, input {
            width: 100%;
            padding: 1rem;
            border-radius: 12px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: #333;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #FBC02D;
            background: rgba(255, 255, 255, 0.9);
            box-shadow: 0 0 0 3px rgba(251, 192, 45, 0.2);
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
        }

        .btn {
            padding: 1.2rem 2rem;
            border: none;
            border-radius: 15px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn-primary {
            background: linear-gradient(45deg, #4CAF50, #66BB6A);
            color: #FFFFFF;
            box-shadow: 0 4px 15px rgba(76, 175, 80, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            background: linear-gradient(45deg, #FBC02D, #f7931e);
            color: #1B3B2F;
            box-shadow: 0 8px 25px rgba(251, 192, 45, 0.4);
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .stat {
            background: linear-gradient(135deg, #1B3B2F, #2E4635);
            border-radius: 15px;
            padding: 1.5rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .stat:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .stat .value {
            color: #FBC02D;
            font-weight: bold;
            font-size: 1.5rem;
            margin-top: 0.5rem;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
        }

        .stat div:first-child {
            color: #BDBDBD;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .tips {
            margin-top: 1rem;
            padding-left: 0;
            list-style: none;
        }

        .tips li {
            margin-bottom: 0.8rem;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border-left: 4px solid #FBC02D;
            color: #F5F5F5;
            transition: all 0.3s ease;
        }

        .tips li:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateX(5px);
        }

        .tips li::before {
            content: "💡 ";
            margin-right: 0.5rem;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }
            
            .row {
                grid-template-columns: 1fr;
            }
            
            .stats {
                grid-template-columns: 1fr;
            }
            
            .page-title h1 {
                font-size: 2.2rem;
            }
            
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="logo"><h1>SmartKisan</h1></div>
        <a class="back-btn" href="dashboard.html">← Back</a>
    </header>

    <div class="container">
        <div class="page-title">
            <h1>🤖 AI Yield Predictor</h1>
            <p>Our smart AI will tell you exactly how much you can grow! Just tell us about your farm and we'll do the math.</p>
        </div>

        <div class="grid">
            <div class="card">
                <h3>Inputs</h3>
                <label>State</label>
                <select id="state">
                    <option value="">Select State</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Karnataka">Karnataka</option>
                    <option value="Tamil Nadu">Tamil Nadu</option>
                    <option value="Gujarat">Gujarat</option>
                    <option value="Rajasthan">Rajasthan</option>
                    <option value="Punjab">Punjab</option>
                    <option value="Haryana">Haryana</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Bihar">Bihar</option>
                    <option value="West Bengal">West Bengal</option>
                </select>
                <label>City</label>
                <input id="city" placeholder="Enter city" />
                <div class="row">
                    <div>
                        <label>Crop</label>
                        <select id="crop">
                            <option>Rice</option>
                            <option>Wheat</option>
                            <option>Soybean</option>
                            <option>Maize</option>
                            <option>Cotton</option>
                            <option>Sugarcane</option>
                        </select>
                    </div>
                    <div>
                        <label>Area</label>
                        <div class="row">
                            <input id="area" type="number" min="0.1" step="0.1" value="1" />
                            <select id="unit"><option>acres</option><option>hectares</option></select>
                        </div>
                    </div>
                </div>
                <div style="margin-top:1.5rem;">
                    <button class="btn btn-primary" onclick="runPrediction()">🔮 Predict My Yield!</button>
                </div>
            </div>

            <div class="card">
                <h3>🎯 Your Prediction</h3>
                <div class="stats">
                    <div class="stat">
                        <div>Yield (tons/ha)</div>
                        <div class="value" id="tonsPerHa">-</div>
                    </div>
                    <div class="stat">
                        <div>Total Yield</div>
                        <div class="value" id="totalTons">-</div>
                    </div>
                    <div class="stat">
                        <div>Confidence</div>
                        <div class="value" id="confidence">-</div>
                    </div>
                </div>
                <h3 style="margin-top:1.5rem; color: #F5F5F5; font-size: 1.2rem;">💡 Actionable Tips</h3>
                <ul class="tips" id="tips"></ul>
            </div>
        </div>
    </div>

    <script>
        async function runPrediction() {
            const state = document.getElementById('state').value || 'Maharashtra';
            const city = document.getElementById('city').value || 'Nagpur';
            const crop = document.getElementById('crop').value;
            const area = parseFloat(document.getElementById('area').value || '1');
            const unit = document.getElementById('unit').value;

            const { lat, lon } = await window.SYServices.geocodeCityState(city, state);
            const weather = await window.SYServices.fetchWeather(lat, lon);
            const soil = await window.SYServices.fetchSoil(lat, lon);

            const input = { crop, area, unit, weather, soil };
            const pred = window.SYAI.predictYield(input);
            const recs = window.SYAI.getRecommendations(input);

            document.getElementById('tonsPerHa').textContent = pred.tonsPerHa + ' t/ha';
            document.getElementById('totalTons').textContent = pred.totalTons + ' t';
            document.getElementById('confidence').textContent = pred.confidence + '%';
            document.getElementById('tips').innerHTML = recs.map(t => `<li>${t}</li>`).join('');
        }
    </script>
</body>
</html>
